<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap do Kaizen</title>
<!--
  Visualização local do roadmap. Abre do disco, sem servidor e sem rede.
  Dados: data.js, gerado por `pnpm roadmap:view` a partir de roadmap/ e docs/ (não versionado).
  A página só desenha: estados vêm de roadmap/README.md e todo cálculo vem do gerador.
  Rotas: #/ · #/epic/E06 · #/matrix · #/kanban · #/task/E06-T26 · #/docs · #/doc/<caminho>
-->
<style>
:root{
  --bg:#f6f6f3;--surface:#fff;--surface-2:#f0efea;--ink:#1d1f22;--muted:#5f636a;--faint:#8b8f96;--line:#e2e1dc;
  --accent:#c2410c;--accent-soft:#fff1e8;--focus:#2563eb;--danger:#b42318;
  --st-planned:#8b8f96;--st-planned-bg:#eeeeea;
  --st-ready:#1d63c9;--st-ready-bg:#e7effb;
  --st-progress:#a15c00;--st-progress-bg:#fdf0d9;
  --st-blocked:#b42318;--st-blocked-bg:#fde8e6;
  --st-done:#1f7a46;--st-done-bg:#e3f3e9;
  --st-cancelled:#c4c5c0;--st-cancelled-bg:#f1f1ee;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.05);
  --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:26px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121315;--surface:#1b1d20;--surface-2:#24272b;--ink:#ecedef;--muted:#a6abb3;--faint:#7d828a;--line:#2f3337;
    --accent:#fb923c;--accent-soft:#3a2517;--focus:#60a5fa;--danger:#f87171;
    --st-planned:#a6abb3;--st-planned-bg:#2a2d31;
    --st-ready:#7fb0f5;--st-ready-bg:#1c2b40;
    --st-progress:#f2b55a;--st-progress-bg:#3a2c15;
    --st-blocked:#f58a80;--st-blocked-bg:#3d1f1c;
    --st-done:#6fcf97;--st-done-bg:#1b3326;
    --st-cancelled:#4b4e53;--st-cancelled-bg:#232427;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-md)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font:0.9em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* cabeçalho */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:var(--fs-md);color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:var(--fs-sm);font-weight:500;white-space:nowrap}
nav.tabs a.on{background:var(--ink);color:var(--surface)}
nav.tabs a:hover:not(.on){background:var(--surface-2)}
.search{position:relative;margin-left:auto;flex:1 1 220px;max-width:360px}
.search input{width:100%;font:inherit;font-size:var(--fs-sm);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 32px rgba(0,0,0,.15);max-height:60vh;overflow:auto;padding:4px}
.search-results a{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:var(--fs-sm)}
.search-results a.sel,.search-results a:hover{background:var(--surface-2)}
.search-results small{color:var(--faint);margin-left:auto;white-space:nowrap}
.stamp{font-size:var(--fs-xs);color:var(--faint);white-space:nowrap}

main{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
h1.page{font-size:var(--fs-xl);line-height:1.2;margin:4px 0 6px}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:0 0 16px;max-width:820px}
.crumbs{font-size:var(--fs-sm);color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
section.block{margin-top:28px}
section.block > h2{font-size:var(--fs-lg);margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:var(--fs-sm);padding:10px 0}

/* status */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.s-PLANNED{--c:var(--st-planned);--cb:var(--st-planned-bg)}
.s-READY{--c:var(--st-ready);--cb:var(--st-ready-bg)}
.s-IN_PROGRESS{--c:var(--st-progress);--cb:var(--st-progress-bg)}
.s-BLOCKED{--c:var(--st-blocked);--cb:var(--st-blocked-bg)}
.s-DONE{--c:var(--st-done);--cb:var(--st-done-bg)}
.s-CANCELLED{--c:var(--st-cancelled);--cb:var(--st-cancelled-bg)}
.chip.s{color:var(--c);background:var(--cb)}
.chip.s.s-CANCELLED{color:var(--muted)}
.dot.s{background:var(--c)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span{background:var(--c);height:100%}

/* chip de tarefa */
.tchip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font:600 var(--fs-xs)/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;padding:1px 8px 1px 6px;border-radius:7px;border-left:4px solid var(--c);background:var(--cb);color:var(--ink);text-decoration:none}
.tchip:hover{filter:brightness(.96)}
.tchip.waiting{opacity:.5}
.tchip.active{box-shadow:0 0 0 2px var(--accent)}
.tchip.s-CANCELLED{text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* visão geral */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:18px 20px;align-items:start}
.hero h2{margin:4px 0 6px;font-size:var(--fs-lg);line-height:1.3}
.hero .next{margin:8px 0 0;color:var(--muted);font-size:var(--fs-sm)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{padding:12px 14px}
.stat b{display:block;font-size:var(--fs-xl);line-height:1.1}
.stat span{font-size:var(--fs-sm);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-sm);color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.epics{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.epic{display:flex;flex-direction:column;gap:8px;padding:14px 16px;color:inherit;text-decoration:none}
.epic:hover{border-color:var(--faint)}
.epic .head{display:flex;gap:8px;align-items:center;justify-content:space-between}
.epic .id{font:700 var(--fs-sm) ui-monospace,Consolas,monospace;color:var(--muted)}
.epic h3{margin:0;font-size:var(--fs-md);line-height:1.3}
.epic p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.epic .count{font-size:var(--fs-xs);color:var(--faint)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.list{padding:14px 16px}
.list h3{margin:0 0 8px;font-size:var(--fs-md)}
.row{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.row:first-of-type{border-top:0}
.row a.t{color:var(--ink);text-decoration:none}
.row a.t:hover{text-decoration:underline}
.row .why{margin-left:auto;color:var(--faint);font-size:var(--fs-xs);white-space:nowrap}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.filters .label{font-size:var(--fs-sm);color:var(--muted)}
.pill{font:inherit;font-size:var(--fs-sm);padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-sm);color:var(--muted);cursor:pointer}
.filters input[type=search]{font:inherit;font-size:var(--fs-sm);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:200px}

/* matriz */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.matrix{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:860px}
table.matrix th,table.matrix td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.matrix thead th{font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.matrix th.wave{white-space:nowrap;font-weight:700}
table.matrix td.total,table.matrix th.total{text-align:right;white-space:nowrap}
table.matrix tfoot td{font-weight:600}
.share{font-weight:400;color:var(--muted)}
.note{font-size:var(--fs-xs);color:var(--muted);margin-top:10px}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:120px}
.col h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:var(--fs-sm)}
.col h3 small{margin-left:auto;color:var(--faint);font-weight:500}
.lane{font-size:var(--fs-xs);color:var(--muted);font-weight:600;margin:10px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.kcard{display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:8px 10px;margin-bottom:6px;color:var(--ink);text-decoration:none;font-size:var(--fs-sm)}
.kcard:hover{border-color:var(--faint);border-left-color:var(--c)}
.kcard .id{font:600 var(--fs-xs) ui-monospace,Consolas,monospace;color:var(--muted)}
.kcard .wait{font-size:var(--fs-xs);color:var(--st-blocked);margin-top:4px}
.kcard.waiting{opacity:.65}
.kcard.active{box-shadow:0 0 0 2px var(--accent)}

/* página de leitura */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0 6px}
.fact{padding:10px 14px;font-size:var(--fs-sm)}
.fact .k{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.callout{padding:10px 14px;border-radius:10px;font-size:var(--fs-sm);margin:10px 0}
.callout.ok{background:var(--st-done-bg);color:var(--st-done)}
.callout.warn{background:var(--st-blocked-bg);color:var(--st-blocked)}
.callout.info{background:var(--accent-soft);color:var(--ink)}
.toc{position:sticky;top:76px;font-size:var(--fs-sm);padding:12px 14px;max-height:calc(100vh - 100px);overflow:auto}
.toc b{display:block;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0;line-height:1.35}
.toc a.l3{padding-left:12px;font-size:var(--fs-xs)}
.toc a:hover{color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;font-size:var(--fs-sm)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:var(--fs-sm);padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--faint)}

/* markdown */
.md{padding:6px 24px 20px;overflow-wrap:anywhere}
.md h1{font-size:var(--fs-xl);margin:18px 0 10px}
.md h2{font-size:var(--fs-lg);margin:26px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.md h3{font-size:var(--fs-md);margin:20px 0 8px}
.md h4{font-size:var(--fs-sm);margin:16px 0 6px}
.md p,.md li{max-width:860px}
.md ul,.md ol{padding-left:22px}
.md li{margin:3px 0}
.md li.md-task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:flex-start}
.md-check{flex:none;width:17px;height:17px;margin-top:3px;border:1.5px solid var(--faint);border-radius:4px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--st-done)}
.md li.md-task.done .md-check{border-color:var(--st-done);background:var(--st-done-bg)}
.md blockquote{margin:12px 0;padding:6px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.md blockquote p{margin:6px 0}
.md pre{background:var(--surface-2);padding:12px 14px;border-radius:10px;overflow:auto;font-size:var(--fs-sm)}
.md pre code{background:none;padding:0}
.md-table{overflow-x:auto;margin:12px 0}
.md table{border-collapse:collapse;font-size:var(--fs-sm);min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
.md a.task-link{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
.md a.file-link::after{content:" ↗";font-size:.8em;color:var(--faint)}
.md hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.md .placeholder{color:var(--faint);font-style:italic}

/* documentos */
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.doc{padding:10px 14px;color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.doc:hover{border-color:var(--faint)}
.doc b{font-size:var(--fs-sm);line-height:1.35}
.doc small{color:var(--faint);font-size:var(--fs-xs);overflow-wrap:anywhere}
.tag{font-size:var(--fs-xs);color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.missing{max-width:640px;margin:60px auto;padding:24px}

@media (max-width:900px){
  .reader{grid-template-columns:1fr}
  .toc{position:static;max-height:none}
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .top-inner{padding:10px 16px;gap:10px}
  main{padding:16px 16px 48px}
  .search{order:3;max-width:none;flex-basis:100%}
  .stamp{display:none}
  .md{padding:4px 14px 16px}
  h1.page{font-size:22px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/">Kaizen <span>roadmap</span></a>
    <nav class="tabs" aria-label="Seções">
      <a href="#/" data-tab="overview">Visão geral</a>
      <a href="#/matrix" data-tab="matrix">Matriz</a>
      <a href="#/kanban" data-tab="kanban">Kanban</a>
      <a href="#/docs" data-tab="docs">Documentos</a>
    </nav>
    <div class="search" role="search">
      <label class="sr-only" for="q">Buscar tarefa, épico ou documento</label>
      <input id="q" type="search" placeholder="Buscar tarefa, épico ou documento" autocomplete="off">
      <div class="search-results" id="results" hidden></div>
    </div>
    <span class="stamp" id="stamp"></span>
  </div>
</header>
<main id="app" tabindex="-1"></main>

<script src="markdown.js"></script>
<script src="data.js" onerror="window.ROADMAP_DATA_ERROR=true"></script>
<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  const D = window.ROADMAP_DATA;
  const M = window.KaizenMarkdown;
  const esc = M.escapeHtml;

  if (!D) {
    app.innerHTML =
      '<div class="card missing"><h1 class="page">Dados não gerados</h1><p>Rode <code>pnpm roadmap:view</code> na raiz do repositório e recarregue esta página. O comando cria <code>roadmap/view/data.js</code> a partir de <code>roadmap/</code> e <code>docs/</code>.</p></div>';
    return;
  }

  const LABEL = { PLANNED: "Planejada", READY: "Pronta", IN_PROGRESS: "Em andamento", BLOCKED: "Bloqueada", DONE: "Concluída", CANCELLED: "Cancelada" };
  const ORDER = D.statusOrder;
  const FINAL = new Set(["DONE", "CANCELLED"]);
  const tasksById = new Map(D.tasks.map((t) => [t.id, t]));
  const tasksByPath = new Map(D.tasks.map((t) => [t.path, t]));
  const epicsById = new Map(D.epics.map((e) => [e.id, e]));
  const epicsByPath = new Map(D.epics.map((e) => [e.path, e]));
  const docsByPath = new Map(D.documents.map((d) => [d.path, d]));
  const editorRoot = decodeURI(D.repositoryUrl.replace(/^file:\/\/\/?/, ""));
  const state = { epic: "todos", query: "", onlyReady: false, hideFinal: false, kanbanFinal: false, lane: "epic", docTipo: "todos", docQuery: "" };

  document.getElementById("stamp").textContent =
    "dados de " + new Date(D.generatedAt).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + (D.commit ? " · " + D.commit : "");

  // ---------- utilidades ----------
  const statusChip = (s) => '<span class="chip s s-' + s + '" title="' + s + '"><span class="dot s s-' + s + '"></span>' + LABEL[s] + "</span>";
  const dot = (s) => '<span class="dot s s-' + s + '"></span>';
  const pct = (part, total) => (total ? Math.round((part / total) * 100) + "%" : "—");
  const editorHref = (path) => "vscode://file/" + editorRoot.replace(/\/$/, "") + "/" + path;

  function tooltip(t) {
    return t.id + " · " + LABEL[t.status] + "\n" + t.title + (t.pending.length ? "\naguardando: " + t.pending.join(", ") : "") + (t.external.length ? "\ncondição externa: " + t.external.join(", ") : "");
  }
  function taskChip(t) {
    const cls = ["tchip", "s-" + t.status];
    if (t.waiting) cls.push("waiting");
    if (D.active.task === t.id) cls.push("active");
    return '<a class="' + cls.join(" ") + '" href="#/task/' + t.id + '" title="' + esc(tooltip(t)) + '">' + t.id + "</a>";
  }
  function stackedBar(counts, total) {
    if (!total) return '<div class="bar"></div>';
    return '<div class="bar" role="img" aria-label="' + ORDER.filter((s) => counts[s]).map((s) => counts[s] + " " + LABEL[s].toLowerCase()).join(", ") + '">' +
      ORDER.filter((s) => counts[s]).map((s) => '<span class="s-' + s + '" style="width:' + (counts[s] / total) * 100 + '%"></span>').join("") + "</div>";
  }
  function legend() {
    return '<div class="legend">' + ORDER.map((s) => "<span>" + dot(s) + LABEL[s] + "</span>").join("") + "</div>";
  }
  function countStatuses(list) {
    return Object.fromEntries(ORDER.map((s) => [s, list.filter((t) => t.status === s).length]));
  }
  function waveLabel(w) {
    return w === "done" ? "Finalizadas" : "Onda " + w;
  }
  function wavesOf(list) {
    return [...new Set(list.map((t) => t.wave))].sort((a, b) => (a === "done" ? 1 : b === "done" ? -1 : Number(a) - Number(b)));
  }
  function matches(t, q) {
    if (!q) return true;
    const s = q.toLowerCase();
    return t.id.toLowerCase().includes(s) || t.title.toLowerCase().includes(s);
  }

  // ---------- links do markdown ----------
  function normalize(path) {
    const out = [];
    for (const part of path.split("/")) {
      if (!part || part === ".") continue;
      if (part === "..") out.pop(); else out.push(part);
    }
    return out.join("/");
  }
  function routeFor(path, anchor) {
    const a = anchor ? "?a=" + encodeURIComponent(anchor) : "";
    if (tasksByPath.has(path)) return "#/task/" + tasksByPath.get(path).id + a;
    if (epicsByPath.has(path)) return "#/epic/" + epicsByPath.get(path).id + a;
    if (path === "roadmap/README.md") return "#/matrix";
    if (docsByPath.has(path)) return "#/doc/" + path + a;
    return null;
  }
  function linkResolver(fromPath) {
    const base = fromPath.split("/").slice(0, -1).join("/");
    return function (href) {
      if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return { href, external: true };
      const [rawPath, anchor] = href.split("#");
      if (!rawPath) return { href: currentRoute().split("?")[0] + "?a=" + encodeURIComponent(anchor || "") };
      let decoded = rawPath;
      try { decoded = decodeURI(rawPath); } catch (e) { /* mantém */ }
      const path = normalize((base ? base + "/" : "") + decoded);
      const route = routeFor(path, anchor);
      if (route) return { href: route, className: tasksByPath.has(path) ? "task-link" : "" };
      return { href: editorHref(path), className: "file-link", external: false };
    };
  }
  function renderMarkdown(markdown, fromPath) {
    const body = markdown.replace(/^\s*#\s.*\n?/, "");
    const result = M.render(body, { resolveLink: linkResolver(fromPath) });
    result.html = result.html
      .replace(/<p>(Não registrado na versão original desta tarefa[^<]*?)<\/p>/g, '<p class="placeholder">$1</p>')
      // Caminho do repositório citado como código (`docs/...`, `src/...`): vira link.
      .replace(/(<a [^>]*>[\s\S]*?<\/a>)|<code>((?:docs|roadmap|src|scripts|prisma|data|tests|schemas|messages)\/[^<\s]+?)<\/code>/g, function (all, anchor, path) {
        if (anchor) return anchor;
        const clean = path.replace(/[.,;:]$/, "");
        const route = routeFor(clean, null);
        return '<a href="' + esc(route || editorHref(clean)) + '"' + (route ? "" : ' class="file-link"') + "><code>" + path + "</code></a>";
      });
    return result;
  }
  function inlineMarkdown(text, fromPath) {
    return renderMarkdown(text, fromPath).html.replace(/^<p>|<\/p>$/g, "");
  }
  function toc(headings) {
    const items = headings.filter((h) => h.level <= 3);
    if (items.length < 2) return "";
    return '<aside class="card toc" aria-label="Nesta página"><b>Nesta página</b>' +
      items.map((h) => '<a class="l' + h.level + '" href="' + currentRoute().split("?")[0] + "?a=" + encodeURIComponent(h.id) + '">' + esc(h.text) + "</a>").join("") + "</aside>";
  }

    for (const id of ["onlyReady", "hideFinal", "kanbanFinal"]) {
      const el = app.querySelector("#" + id);
      if (el) el.addEventListener("change", () => { state[id] = el.checked; rerender(); });

  }

  function route() {
    const [path, query] = currentRoute().slice(1).split("?");
    const anchor = new URLSearchParams(query || "").get("a");
    const parts = path.split("/").filter(Boolean);
    const [kind, ...rest] = parts;
    const scrollKey = "view:" + path;
    if (!kind) viewOverview();
    else if (kind === "epic") viewEpic(rest[0]);
    else if (kind === "matrix") viewMatrix();
    else if (kind === "kanban") viewKanban();
    else if (kind === "task") viewTask(rest[0]);
    else if (kind === "docs") viewDocs();
    else if (kind === "doc") viewDoc(decodeURIComponent(rest.join("/")));
    else notFound("A página " + path);
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) { el.scrollIntoView({ block: "start" }); window.scrollBy(0, -70); return; }
    }
    if (route.last !== scrollKey) window.scrollTo(0, 0);
    route.last = scrollKey;
    document.title = (app.querySelector("h1")?.textContent || "Roadmap") + " · Kaizen";
  }

  // ---------- busca global ----------
  const q = document.getElementById("q");
  const results = document.getElementById("results");
  let hits = [];

  function search() {
    const s = q.value.trim().toLowerCase();
    if (!s) { results.hidden = true; return; }
    hits = [
      ...D.tasks.filter((t) => matches(t, s)).map((t) => ({ href: "#/task/" + t.id, label: t.id + " · " + t.title, kind: LABEL[t.status] })),
      ...D.epics.filter((e) => (e.id + " " + e.title).toLowerCase().includes(s)).map((e) => ({ href: "#/epic/" + e.id, label: e.id + " · " + e.title, kind: "Épico" })),
      ...D.documents.filter((d) => (d.title + " " + d.path).toLowerCase().includes(s)).map((d) => ({ href: "#/doc/" + d.path, label: d.title, kind: d.tipo || "Documento" })),
    ].slice(0, 14);
    sel = 0;
    results.innerHTML = hits.length ? hits.map((h, i) => '<a href="' + h.href + '"' + (i === sel ? ' class="sel"' : "") + ">" + esc(h.label) + "<small>" + esc(h.kind) + "</small></a>").join("") : '<p class="empty" style="padding:8px 10px">Nada encontrado.</p>';
    results.hidden = false;
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", (ev) => {
    if (results.hidden) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      sel = (sel + (ev.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(hits.length, 1);
      results.querySelectorAll("a").forEach((a, i) => a.classList.toggle("sel", i === sel));
    } else if (ev.key === "Enter" && hits[sel]) {
      location.hash = hits[sel].href;
      q.value = ""; results.hidden = true;
    } else if (ev.key === "Escape") {
      results.hidden = true;
    }
  });
  results.addEventListener("click", () => { q.value = ""; results.hidden = true; });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) results.hidden = true; });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement.tagName !== "INPUT") { ev.preventDefault(); q.focus(); }
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
