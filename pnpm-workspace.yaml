allowBuilds:
  "esbuild@0.28.2": true
  "@prisma/engines": true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@fradelli/ui@0.3.0 || 0.6.0"

overrides:
  # GHSA-ggr8-5vv4-36mx: Prisma usa deepmerge para objetos da configuração.
  # Compatibilidade deve ser validada também na E05-T02; remover quando o
  # Prisma estável incorporar a correção. Não amplia o override a outros pais.
  "@prisma/config@7.10.0>deepmerge-ts": 8.0.2
  "prisma@7.10.0>mysql2": 3.23.1
  # Patches compatíveis para GHSA-q2hr-2g5m-vwhr e GHSA-68fv-2mgg-jv7q.
  "minimatch@10.2.6>brace-expansion": 5.0.12
  "magicast@0.5.4>source-map-js": 1.2.2
  # GHSA-vfj7-8cjw-p6xm: fork interno com limite de profundidade; detalhes em vendor/braces/README.kaizen.md.
  "micromatch@4.0.8>braces": file:vendor/braces
